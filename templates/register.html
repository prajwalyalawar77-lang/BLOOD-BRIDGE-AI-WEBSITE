<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | BloodBridge AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#3a1919,#171416 45%,#101011);color:#f8f5f5;font-family:Arial,sans-serif}
.card{width:min(100%,450px);padding:32px;border:1px solid #4b3030;border-radius:20px;background:#1b1b1e;box-shadow:0 22px 70px #0008}
.logo{text-align:center;font-size:36px}
h1{text-align:center;margin:12px 0 8px}
.sub{text-align:center;color:#b8b8be;margin:0 0 23px}
label{display:block;margin:14px 0 7px;font-weight:bold;font-size:14px}
input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #49494f;background:#111114;color:white;font-size:15px}
input:focus{outline:2px solid #d45b45}
button{width:100%;border:0;border-radius:10px;margin-top:22px;padding:14px;color:white;font-size:16px;font-weight:bold;background:linear-gradient(110deg,#a72730,#d75b43);cursor:pointer}
.message{padding:11px;border-radius:9px;margin:12px 0;font-size:14px}
.error{background:#4a2023;color:#ffd9d9}
.foot{text-align:center;margin-top:22px;color:#b8b8be;font-size:14px}
a{color:#ff9c89;text-decoration:none}
.home{display:block;text-align:center;margin-top:17px;color:#d4c4c4;font-size:13px}
</style>
</head>
<body>
<main class="card">
<div class="logo">🩸</div>
<h1>Join BloodBridge AI</h1>
<p class="sub">Create an account for the emergency blood network</p>

{% if error %}
<div class="message error" role="alert">{{ error }}</div>
{% endif %}

<form method="POST" action="{{ url_for('register') }}">
<label for="name">Full name</label>
<input id="name" name="name" type="text" autocomplete="name" required maxlength="100" value="{{ name|default('') }}">

<label for="email">Email address</label>
<input id="email" name="email" type="email" autocomplete="email" required maxlength="254" value="{{ email|default('') }}">

<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

<label for="confirm_password">Confirm password</label>
<input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>

<button type="submit">CREATE ACCOUNT</button>
</form>

<p class="foot">Already have an account?
<a href="{{ url_for('login') }}">Log in</a></p>

<a class="home" href="{{ url_for('home') }}">Back to dashboard</a>
</main>
</body>
</html>
